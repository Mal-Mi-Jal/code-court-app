<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코드 법정</title>
<meta name="description" content="증언 속 모순을 실행 결과로 반박하며 배우는 재판형 코드 학습 앱">
<meta name="theme-color" content="#0c0b0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;600&family=Nanum+Myeongjo:wght@800&display=swap">
<link rel="stylesheet" href="css/app.css?v=8">
</head>
<body>
<div class="wrap" id="wrap">
  <header class="casebar">
    <div>
      <div class="ep" id="ep">코드 법정</div>
      <h1 id="caseTitle">코드 법정</h1>
    </div>
    <div class="trust" id="trustBox" aria-label="재판장 신뢰도">
      <span id="trustLabel">신뢰도</span><span id="hearts"></span>
      <button class="homebtn" id="homeBtn">사건 목록</button>
      <button class="homebtn sound" id="musicBtn" aria-pressed="true" aria-label="배경 음악">음악 켬</button>
      <button class="homebtn sound" id="soundBtn" aria-pressed="true" aria-label="효과음">효과음 켬</button>
    </div>
  </header>

  <section class="menu" id="menu" hidden>
    <button class="backbtn" id="backBtn" hidden>← 코스 목록</button>
    <p class="lead" id="lead">증언에서 모순을 찾아 증거를 제시하세요. 코드가 정말 그렇게 동작하는지, 반례와 실행 결과로 반박하는 재판이에요.</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="언어" hidden></div>
    <div class="cases" id="cases"></div>
    <p class="note">진행 상황은 이 기기에만 저장돼요.</p>
    <a class="feedback" href="https://forms.gle/Ym5zNLmMVWrHjkL76" target="_blank" rel="noopener">✉ 의견 남기기 <small>어려웠던 사건, 틀린 설명, 원하는 주제 (익명, 1분)</small></a>
  </section>

  <section class="stage" id="stage" hidden>
    <div class="scene" id="scene">
      <div class="blinds" aria-hidden="true"></div>
      <div class="spot" aria-hidden="true"></div>
      <div class="portrait" id="portrait"></div>
      <div class="plate" id="plate"></div>
    </div>
    <div class="box" id="box">
      <div class="who" id="who">재판장</div>
      <div id="tagline"></div>
      <p class="text" id="text"></p>
      <span class="more" id="more" aria-hidden="true">▼</span>
    </div>
    <div id="choiceArea"></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<!-- 타이틀 화면 -->
<div class="title" id="title" role="dialog" aria-label="코드 법정 시작 화면">
  <div class="title-blinds" aria-hidden="true"></div>
  <div class="title-spot" aria-hidden="true"></div>
  <div class="title-in">
    <p class="title-kicker">CODE COURT</p>
    <h1 class="title-logo">코드 법정</h1>
    <p class="title-tag">그 코드, 정말 그렇게 동작합니까?<br>증언 속 모순을 <b>실행 결과</b>로 반박하세요.</p>
    <button class="btn primary title-start" id="startBtn">재판 시작</button>
    <p class="title-note">음악과 효과음이 있어요 · 오른쪽 위에서 끌 수 있어요</p>
  </div>
</div>

<div class="shout" id="shout" hidden>
  <div class="flash" aria-hidden="true"></div>
  <div class="lines" aria-hidden="true"></div>
  <div class="evfly" id="evFly" hidden></div>
  <span id="shoutText">이의 있음!</span>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="법정 기록">
  <div class="sheet-in">
    <h2 id="sheetTitle">법정 기록</h2>
    <p class="hint" id="sheetHint"></p>
    <div class="ev-list" id="evList"></div>
    <div class="ev-detail" id="evDetail" hidden></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<script src="js/core.js?v=8"></script>
<script src="js/ads.js?v=8"></script>
<script src="js/fx.js?v=8"></script>
<script src="js/ui.js?v=8"></script>
</body>
</html>
